[build]
  base = "."
  publish = "netlify-preview/site"
  edge_functions = "netlify-preview/netlify/edge-functions"

[dev]
  framework = "#static"
  publish = "netlify-preview/site"
  port = 4195

# The edge function declares /* in its source. Do not enable Split Testing:
# Netlify documents that it bypasses Edge Functions.
